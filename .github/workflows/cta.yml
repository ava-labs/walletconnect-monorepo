name: "CTA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read  # 'read' if using remote-organization-name + remote-repository-name
  pull-requests: write

jobs:
  CTA:
    runs-on: ubuntu-latest
    steps:
      - uses: walletconnect/actions/github/cta-assistant@d4de429173ca7863ea4813cdabcb73557178520f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
